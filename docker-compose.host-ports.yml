services:
  postgres:
    ports:
      - "127.0.0.1:15432:5432"
      - "[::1]:15432:5432"

  minio:
    ports:
      - "127.0.0.1:${MINIO_API_PORT:-19000}:9000"
      - "[::1]:${MINIO_API_PORT:-19000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-19001}:9001"
      - "[::1]:${MINIO_CONSOLE_PORT:-19001}:9001"

  app:
    ports:
      - "127.0.0.1:13000:3000"
      - "[::1]:13000:3000"
