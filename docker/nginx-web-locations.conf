location / {
  proxy_pass http://$upstream_app;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection $connection_upgrade;
  proxy_read_timeout 300s;
}

location /api/auth/ {
  limit_req zone=admin_limit burst=20 nodelay;
  proxy_pass http://$upstream_app;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
}

location /api/admin/ {
  limit_req zone=admin_limit burst=30 nodelay;
  proxy_pass http://$upstream_app;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
}

location ^~ /api/agent-export/v1/ {
  proxy_pass http://$upstream_web_export;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
}

location ^~ /api/agent-write/v1/ {
  limit_req zone=agent_limit burst=30 nodelay;
  client_max_body_size 600m;
  proxy_pass http://$upstream_app;
  proxy_http_version 1.1;
  proxy_request_buffering off;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_read_timeout 300s;
  proxy_send_timeout 300s;
}

location = /guide-agent {
  return 301 /guide-agent/;
}

location ^~ /api/guide-agent/v1/ {
  limit_req zone=agent_limit burst=30 nodelay;
  client_max_body_size 50m;
  proxy_pass http://$upstream_guide_agent_rag;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_read_timeout 300s;
  proxy_send_timeout 300s;
}

location ^~ /api/guide-agent/ {
  limit_req zone=agent_limit burst=30 nodelay;
  client_max_body_size 50m;
  proxy_pass http://$upstream_guide_agent_core;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection $connection_upgrade;
  proxy_buffering off;
  proxy_cache off;
  proxy_read_timeout 300s;
  proxy_send_timeout 300s;
  add_header X-Accel-Buffering "no" always;
}

location ^~ /guide-agent/ {
  client_max_body_size 50m;
  proxy_pass http://$upstream_guide_agent_core;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_read_timeout 300s;
}

location /media/ {
  proxy_pass http://$upstream_app;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-Host $host;
  expires 30d;
  add_header Cache-Control "public, immutable";
  add_header Strict-Transport-Security "max-age=86400" always;
}
