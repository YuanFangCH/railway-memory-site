worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  client_max_body_size 600m;
  limit_req_zone $binary_remote_addr zone=admin_limit:10m rate=10r/m;
  limit_req_zone $binary_remote_addr zone=agent_limit:10m rate=60r/m;

  resolver 127.0.0.11 valid=10s ipv6=off;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    "" close;
  }

  server {
    listen 8080;
    server_name _;
    set $upstream_app app:3000;
    set $upstream_web_export app:3000;
    set $upstream_guide_agent_core guide-agent-core:8080;
    set $upstream_guide_agent_rag guide-agent-rag:8000;

    include /etc/nginx/nginx-web-locations.conf;
  }
}
